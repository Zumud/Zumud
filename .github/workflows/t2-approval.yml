name: T2 approval

# The risk-tier merge policy's only human step. A PR touching auth, billing,
# migrations, dependencies or the pipeline itself fails this required check
# until the maintainer signs off; everything else passes automatically and can
# auto-merge on green.
#
# Which tier a PR is in is worked out here from its own diff
# (scripts/tier_gate.py, using labeler.yml's paths) rather than read from the
# tier:T2 label. The label is applied by another workflow using GITHUB_TOKEN,
# and a token-driven label starts no further workflow runs — so this check
# raced the labeler and passed vacuously whenever it won, which is how #210 and
# #212 merged with no human step. The label stays for visibility only.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  pull_request_review:
    types: [submitted, dismissed]
  merge_group:

# Sign-off routes: PR approval, or the t2-approved label for self-authored
# PRs (GitHub forbids self-approval).

permissions:
  contents: read
  pull-requests: read

jobs:
  t2:
    name: T2 approval
    runs-on: ubuntu-latest
    steps:
      - name: Merge queue pass-through
        if: github.event_name == 'merge_group'
        run: echo "Tier policy already satisfied at PR level."
      - name: Check out the gate
        if: github.event_name != 'merge_group'
        uses: actions/checkout@v4
      - name: Check tier policy
        if: github.event_name != 'merge_group'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # Fetched into a variable rather than piped, so that an API failure aborts the
          # step under `bash -e`. Piped, it would reach the gate as an empty diff and be
          # waved through as tier 1 — a gate has to fail closed.
          # Both names of a renamed file: the API reports a rename under its new path
          # only, so moving requirements.txt elsewhere would otherwise read as tier 1.
          files=$(gh api "repos/$REPO/pulls/$PR/files" --paginate \
            --jq '.[] | .filename, (.previous_filename // empty)')
          if printf '%s\n' "$files" | python3 scripts/tier_gate.py; then
            echo "Tier 1 — no human sign-off required."
            exit 0
          fi
          labels=$(gh api "repos/$REPO/pulls/$PR" --jq '[.labels[].name] | join(",")')
          # Maintainer sign-off is either a PR approval or the t2-approved
          # label (GitHub forbids approving your own PR, so a solo maintainer
          # — or an agent authoring under their account — signs off by
          # applying the label; label application needs triage permission
          # and is recorded in the PR timeline).
          if grep -q 't2-approved' <<<"$labels"; then
            echo "tier:T2 with t2-approved label — pass."
            exit 0
          fi
          approved=$(gh api "repos/$REPO/pulls/$PR/reviews" --paginate --jq '
            [ .[] | select(.author_association == "OWNER"
                        or .author_association == "MEMBER"
                        or .author_association == "COLLABORATOR") ]
            | group_by(.user.login) | map(last)
            | map(select(.state == "APPROVED")) | length')
          if [ "$approved" -ge 1 ]; then
            echo "tier:T2 with maintainer approval — pass."
          else
            echo "::error::This PR is tier:T2 (auth/billing/schema/deps/pipeline) and needs maintainer sign-off: a PR approval or the t2-approved label."
            exit 1
          fi
